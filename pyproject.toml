[project]
name = "nksr-local"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gitpython>=3.1.45",
    "matplotlib>=3.10.7",
    "ninja>=1.13.0",
    "nksr",
    "numpy>=2.2.6",
    "plyfile>=1.1.3",
    "pyntcloud>=0.3.1",
    "python-pycg[all]>=1.0.1",
    "torch==2.7.0",
    "torch-scatter>=2.1.2",
    "torchvision>=0.22.0",
]

[tool.uv.sources]
nksr = { path = "./package", editable = true }

[tool.uv]
no-build-isolation-package = ["nksr", "torch-scatter"]

